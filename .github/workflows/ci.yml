name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NKAPBackend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: nkap
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci
      DB_NAME: nkap
      JWT_SECRET: ci-access-secret
      JWT_SECRET_REFRESH: ci-refresh-secret
      ADMIN_EMAIL: admin@nkap.local
      ADMIN_PASSWORD: Admin123!
      CLIENT_ORIGIN: http://localhost:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: NKAPBackend/package-lock.json
      - run: npm ci
      - name: Create base tables
        run: node --input-type=module -e "import fs from 'fs'; import mysql from 'mysql2/promise'; const conn = await mysql.createConnection({ host: process.env.DB_HOST, user: process.env.DB_USER, password: process.env.DB_PASSWORD, database: process.env.DB_NAME, multipleStatements: true }); await conn.query(fs.readFileSync('dbase.sql','utf8')); await conn.end();"
      - run: npm test

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NKAPTRANSFERT
    env:
      CI: true
      REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: NKAPTRANSFERT/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: web
          path: NKAPTRANSFERT/build
          retention-days: 7

  image:
    name: Publish API image
    needs: api
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: NKAPBackend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nkap-api:latest
            ghcr.io/${{ github.repository_owner }}/nkap-api:${{ github.sha }}
